<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mentors - STLBAC</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
      <!-- Header -->
      <header>
        <div class="logo">
            <img src="STLBAC_Logo2.webp" alt="Community Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="connect.html">Connect</a></li>
                <li><a href="our-story.html">Our Story</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </nav>
        <div class="buttons">
            <a href="donate.html"><button class="donate">Donate</button></a>
            <a href="profile.html"><button class="join">Join Today</button></a>
        </div>
    </header>

  <h1>Meet Our Mentors</h1>
  <div class="events-container">

    <!-- Mentor Card 1 -->
    <div class="event-card">
      <img src="Vedada.webp" alt="Mentor 1">
      <h2>Vedada Becirovic</h2>
      <p>Expertise: Higher Education</p>
      <div class="event-buttons">
        <!-- Pass unique data via attributes -->
        <button
          class="details-btn"
          data-name="Vedada Becirovic"
          data-expertise="Higher Education"
          data-bio="Vedada has extensive experience in guiding students to thrive in higher education..."
        >
          Details
        </button>
        <button class="rsvp-btn">Message</button>
      </div>
    </div>

    <!-- Mentor Card 2 -->
    <div class="event-card">
      <img src="AminaSelimovic.webp" alt="Mentor 2">
      <h2>Amina Selimovic</h2>
      <p>Expertise: Nuclear Medicine Technology</p>
      <div class="event-buttons">
        <!-- Different data for this mentor -->
        <button
          class="details-btn"
          data-name="Amina Selimovic"
          data-expertise="Nuclear Medicine Technology"
          data-bio="Amina specializes in nuclear medicine and has a passion for teaching and mentoring..."
        >
          Details
        </button>
        <button class="rsvp-btn">Message</button>
      </div>
    </div>

    <!-- Add more mentor cards as needed... -->

  </div>

  <!-- Single Modal for Mentor Details -->
  <div id="mentorModal" class="modal">
    <div class="modal-content">
      <!-- Close button -->
      <span class="close-modal">&times;</span>
      
      <!-- Elements we will populate dynamically -->
      <h2 id="mentorName"></h2>
      <p id="mentorExpertise"></p>
      <hr>
      <p id="mentorBio"></p>
    </div>
  </div>

  <!-- JavaScript that controls the modal for mentors -->
  <script src="mentorsModel.js"></script>
</body>
</html>
